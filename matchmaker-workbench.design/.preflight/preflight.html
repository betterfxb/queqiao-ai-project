<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">

    <title>Preflight</title>
    <style id="theme-vars">
/* ==========================================================================
   Matchmaker Workbench — Liquid Glass Design System
   Brand: 婚恋红娘智能工作台
   Palette: Warm White + Burgundy + Champagne Gold
   ========================================================================== */

:root {
  /* --- Brand Primary: Burgundy (勃艮第红) --- */
  --brand-primary: #8B254A;
  --brand-primary-light: #A33D62;
  --brand-primary-lighter: #C8688A;
  --brand-primary-soft: rgba(139, 37, 74, 0.08);
  --brand-primary-soft-2: rgba(139, 37, 74, 0.15);
  --brand-primary-glow: rgba(139, 37, 74, 0.25);
  --brand-primary-foreground: #FFFFFF;

  /* --- Accent: Champagne Gold (香槟金) --- */
  --brand-gold: #D4AF37;
  --brand-gold-light: #E5C96A;
  --brand-gold-dark: #B8962E;
  --brand-gold-soft: rgba(212, 175, 55, 0.12);
  --brand-gold-gradient: linear-gradient(135deg, #E5C96A 0%, #D4AF37 50%, #B8962E 100%);

  /* --- Background: Warm White to Oat gradient --- */
  --brand-bg-base: #FDFBF7;
  --brand-bg-oat: #F5F0EB;
  --brand-bg-gradient: linear-gradient(180deg, #FDFBF7 0%, #F5F0EB 100%);

  /* --- Semantic surfaces --- */
  --brand-background: #FDFBF7;
  --brand-foreground: #3D2832;
  --brand-card: rgba(255, 255, 255, 0.72);
  --brand-card-solid: #FFFFFF;
  --brand-card-foreground: #3D2832;
  --brand-popover: rgba(255, 255, 255, 0.92);
  --brand-popover-foreground: #3D2832;
  --brand-muted: rgba(139, 37, 74, 0.04);
  --brand-muted-foreground: #8C7A82;
  --brand-border: rgba(139, 37, 74, 0.08);
  --brand-border-strong: rgba(139, 37, 74, 0.16);
  --brand-input: rgba(255, 255, 255, 0.6);
  --brand-ring: rgba(139, 37, 74, 0.35);

  /* --- Liquid Glass surfaces --- */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-bg-strong: rgba(255, 255, 255, 0.75);
  --glass-bg-light: rgba(255, 255, 255, 0.40);
  --glass-border: rgba(255, 255, 255, 0.6);
  --glass-border-inner: rgba(255, 255, 255, 0.8);
  --glass-shadow: 0 8px 32px -8px rgba(80, 40, 30, 0.10);
  --glass-shadow-strong: 0 20px 40px -12px rgba(80, 40, 30, 0.12);
  --glass-shadow-soft: 0 4px 16px -4px rgba(80, 40, 30, 0.06);
  --glass-blur: blur(20px);
  --glass-blur-sm: blur(12px);

  /* --- Ink hierarchy --- */
  --brand-ink-1: #2D1F26;
  --brand-ink-2: #5A4550;
  --brand-ink-3: #8C7A82;
  --brand-ink-4: #B5A6AD;

  /* --- Status colors (semantic only) --- */
  --state-success: #5B8C5A;
  --state-success-soft: rgba(91, 140, 90, 0.10);
  --state-warning: #C89B3C;
  --state-warning-soft: rgba(200, 155, 60, 0.10);
  --state-error: #B84A4A;
  --state-error-soft: rgba(184, 74, 74, 0.10);
  --state-info: #6B7C93;

  /* --- Typography --- */
  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --brand-font-display: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

  /* --- Radius scale (Liquid Glass uses generous rounding) --- */
  --brand-radius-sm: 8px;
  --brand-radius-md: 14px;
  --brand-radius-lg: 20px;
  --brand-radius-xl: 28px;
  --brand-radius-2xl: 32px;
  --brand-radius-pill: 999px;

  /* --- Shadows --- */
  --brand-shadow-xs: 0 1px 2px rgba(80, 40, 30, 0.04);
  --brand-shadow-sm: 0 2px 8px -2px rgba(80, 40, 30, 0.06);
  --brand-shadow-md: 0 8px 24px -8px rgba(80, 40, 30, 0.10);
  --brand-shadow-lg: 0 20px 40px -12px rgba(80, 40, 30, 0.12);
  --brand-shadow-glow: 0 0 24px rgba(139, 37, 74, 0.15);

  /* --- Spacing (8pt grid) --- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
}

/* --- Noise texture overlay for premium feel --- */
.noise-texture::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.035;
  pointer-events: none;
  z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 128px 128px;
}

/* --- Liquid Glass base card --- */
.glass-card {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: var(--brand-radius-xl);
}

.glass-card-strong {
  background: var(--glass-bg-strong);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow-strong);
  border-radius: var(--brand-radius-xl);
}

/* --- Focus ring --- */
.focus-ring:focus-within,
.focus-ring:focus-visible {
  box-shadow: 0 0 0 3px var(--brand-primary-glow), var(--glass-shadow);
  border-color: var(--brand-primary-light);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">

    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
    --radius-xl: var(--brand-radius-xl);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
