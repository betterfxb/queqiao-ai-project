# 鹊桥·红娘工作台 —— 全栈生产编排
# 用法：
#   1) 复制 .env.example 为 .env，按需修改密钥与 IP
#   2) 将前端构建产物放到 ./deploy/admin-dist 与 ./deploy/h5
#   3) docker compose up -d --build
#   4) 访问 http://<服务器IP>/  (admin)  与  http://<服务器IP>/h5/  (采集页)

services:
  # ---------- MySQL 8.0 ----------
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: queqiao
      MYSQL_USER: ${QUEQIAO_DB_USER:-queqiao}
      MYSQL_PASSWORD: ${QUEQIAO_DB_PASSWORD:?请设置QUEQIAO_DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"   # 仅本地，不暴露公网
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:?}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- Java 后端 ----------
  app:
    build:
      context: ./queqiao-server-java
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      QUEQIAO_DB_URL: jdbc:mysql://mysql:3306/queqiao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      QUEQIAO_DB_USER: ${QUEQIAO_DB_USER:-queqiao}
      QUEQIAO_DB_PASSWORD: ${QUEQIAO_DB_PASSWORD:?}
      QUEQIAO_JWT_SECRET: ${QUEQIAO_JWT_SECRET:?请设置QUEQIAO_JWT_SECRET}
      QUEQIAO_SIGN_SECRET: ${QUEQIAO_SIGN_SECRET:-queqiao@2026#sec}
      QQ_AI_BASE: http://python-ai:8090
      QQ_SEED_PASSWORD: ${QQ_SEED_PASSWORD:?请设置QQ_SEED_PASSWORD}
      QQ_CORS_ORIGINS: ${QQ_CORS_ORIGINS:-http://localhost:8080}
      QQ_STRICT_SECRETS: "true"
      SPRING_PROFILES_ACTIVE: prod
    expose:
      - "8080"            # 仅内部网络，不直映宿主机
    restart: unless-stopped

  # ---------- Python AI 服务 ----------
  python-ai:
    build:
      context: ./queqiao-ai
      dockerfile: Dockerfile
    expose:
      - "8090"
    restart: unless-stopped

  # ---------- Nginx 反向代理 + 静态托管 ----------
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
      - python-ai
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "${HTTPS_PORT:-443}:443"   # 申请证书后取消注释并配置 ssl
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/admin-dist:/usr/share/nginx/html/admin:ro
      - ./deploy/h5:/usr/share/nginx/html/h5:ro
      # - ./deploy/certs:/etc/nginx/certs:ro          # TLS 证书
    restart: unless-stopped

volumes:
  mysql-data:
