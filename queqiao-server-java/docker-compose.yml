services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeit}
      MYSQL_DATABASE: queqiao
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-changeit}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      QUEQIAO_DB_URL: jdbc:mysql://mysql:3306/queqiao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      QUEQIAO_DB_USER: root
      QUEQIAO_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeit}
      QUEQIAO_JWT_SECRET: ${QUEQIAO_JWT_SECRET:-change-me-in-prod}
      QUEQIAO_SIGN_SECRET: ${QUEQIAO_SIGN_SECRET:-change-me-in-prod}
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  mysql-data:
