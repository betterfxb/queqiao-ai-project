# 测试专用配置：内存 H2，隔离运行产物，关闭签名/密钥严格校验
spring.datasource.url=jdbc:h2:mem:queqiao-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.flyway.enabled=false

queqiao.sign-secret=test-sign-secret
queqiao.jwt-secret=test-jwt-secret-change-me
queqiao.sign-required=false
queqiao.auth-required=false
qq.strict-secrets=false
queqiao.bcrypt-strength=10
queqiao.seed-password=test123
queqiao.cors.allowed-origins=http://localhost:5173

qq.pay.mode=offline
qq.verify.mode=sandbox
