# ============================================================
# 生产 profile（--spring.profiles.active=prod）
# 与 application.properties 互补：本文件只放「生产差异项」，
# 安全/支付/核验等通用配置仍在 application.properties 中由环境变量驱动。
# 注意：本文件不写任何明文密钥，全部走环境变量（见 .env.example）。
# ============================================================

server.port=8080

# ---- 数据库：MySQL 8.0（由 docker-compose 的 mysql 服务供给）----
spring.datasource.url=${QUEQIAO_DB_URL:jdbc:mysql://mysql:3306/queqiao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${QUEQIAO_DB_USER:queqiao}
spring.datasource.password=${QUEQIAO_DB_PASSWORD:change-me}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 生产：Flyway 拥有表结构，Hibernate 仅校验，禁止自动改表
spring.jpa.hibernate.ddl-auto=validate

# ---- Flyway：生产开启，由迁移脚本管理表结构 ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---- H2 控制台：生产严禁开启 ----
spring.h2.console.enabled=false

# ---- AI 服务地址：容器内指向 python-ai 服务名（同 compose 网络）----
# 若 AI 与 Java 同机非容器部署，改为 http://127.0.0.1:8090
ai.base=${QQ_AI_BASE:http://python-ai:8090}

# ---- 严格密钥校验：使用默认占位密钥/口令/空库密码则启动失败（防误投生产）----
qq.strict-secrets=true

# ---- 生产口令种子：必须用 QQ_SEED_PASSWORD 覆盖（新建账号的初始口令）----
queqiao.seed-password=${QQ_SEED_PASSWORD:CHANGE_ME_SEED}

# ---- CORS：生产用 QQ_CORS_ORIGINS 覆盖为真实前端域名/IP ----
# 例：http://<服务器IP>,http://<服务器IP>:8080
queqiao.cors.allowed-origins=${QQ_CORS_ORIGINS:http://localhost:8080}

# ---- 请求签名：默认关闭，由 QQ_SIGN_REQUIRED 环境变量控制 ----
# 说明：queqiao-workbench（红娘工作台 H5）前端未实现签名头，强制开启会导致线上全 403；
#       管理端 queqiao-admin 部署时设 QQ_SIGN_REQUIRED=true 开启（其前端已实现签名）。
#       本地联调走默认 profile（非 prod），不受此项影响。
queqiao.sign-required=${QQ_SIGN_REQUIRED:false}

# ---- JWT 过期时间（分钟）----
queqiao.jwt-expire-minutes=120
