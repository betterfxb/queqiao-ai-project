server.port=8080
# AI 服务以 127.0.0.1 绑定（仅内网），此处必须用 127.0.0.1 而非 localhost，
# 否则 localhost 优先解析 IPv6(::1) 会导致 RestTemplate 连接被拒、AI 匹配静默降级为本地兜底。
ai.base=http://127.0.0.1:8090

# ============================================================
# 数据库
# 开发/联调：H2 文件型数据库，MODE=MySQL 兼容模式，落盘到 ./data/queqiao.mv.db
# 生产切换 MySQL：删除下方 H2 四行，取消注释「生产 MySQL」段落即可，代码零改动。
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/queqiao;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# H2 控制台默认关闭（生产禁止开启）；本地需要时用 H2_CONSOLE=true 显式打开
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# ============================================================
# Flyway 接管表结构（#158 E）
#  - 默认（dev/H2）：ddl-auto=update，Flyway 关闭，开发零摩擦
#  - migrate / prod profile：Flyway 开启 + ddl-auto=validate，由迁移脚本拥有表结构
#    基线脚本：src/main/resources/db/migration/V1__baseline.sql
#  - 方言差异脚本放 db/migration/{vendor}（h2 / mysql），由 {vendor} 占位符自动选择，
#    例如 V2 金额列 decimal 化：H2 用 alter column、MySQL 用 modify column
# ============================================================
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration,classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0



