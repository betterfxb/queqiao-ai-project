# ============================================================
# 安全 / 签名 / JWT（密钥全部走环境变量，绝不明文；生产必须覆盖）
# 默认占位仅用于本地联调；strict-secrets=true（prod 默认开启）下使用默认密钥将启动失败。
# ============================================================
queqiao.sign-secret=${QQ_SIGN_SECRET:queqiao@2026#sec}
queqiao.jwt-secret=${QQ_JWT_SECRET:queqiao-jwt-secret-2026-change-in-prod}
queqiao.jwt-expire-minutes=120
# 请求签名：本地联调默认关闭，prod profile 强制开启（application-prod.yml）
queqiao.sign-required=${QQ_SIGN_REQUIRED:false}
queqiao.auth-required=${QQ_AUTH_REQUIRED:true}
# 严格密钥校验：true 时若仍使用默认占位密钥/口令/空库密码则启动失败（防误投生产）
qq.strict-secrets=${QQ_STRICT_SECRETS:false}

# 口令策略：BCrypt 强度 + 种子/新建账号初始口令（生产必须用 QQ_SEED_PASSWORD 覆盖）
queqiao.bcrypt-strength=${QQ_BCRYPT_STRENGTH:10}
queqiao.seed-password=${QQ_SEED_PASSWORD:123456}

# CORS 严格白名单（逗号分隔），生产用 QQ_CORS_ORIGINS 覆盖为真实域名
queqiao.cors.allowed-origins=${QQ_CORS_ORIGINS:http://localhost:5170,http://localhost:5173,http://localhost:5190,http://localhost:5191,http://localhost:5200,http://localhost:5270,http://127.0.0.1:5270}

# ============================================================
# 支付（密钥全部走环境变量，绝不明文；缺省 offline 线下模式，工程闭环可跑通）
# 生产接入微信/支付宝时设置环境变量：
#   WECHAT_APP_ID / WECHAT_MCH_ID / WECHAT_API_KEY / WECHAT_NOTIFY_URL
#   ALIPAY_APP_ID / ALIPAY_PRIVATE_KEY / ALIPAY_PUBLIC_KEY / ALIPAY_NOTIFY_URL
# ============================================================
qq.pay.mode=offline
qq.pay.wechat.app-id=${WECHAT_APP_ID:}
qq.pay.wechat.mch-id=${WECHAT_MCH_ID:}
qq.pay.wechat.api-key=${WECHAT_API_KEY:}
qq.pay.wechat.notify-url=${WECHAT_NOTIFY_URL:}
qq.pay.alipay.app-id=${ALIPAY_APP_ID:}
qq.pay.alipay.private-key=${ALIPAY_PRIVATE_KEY:}
qq.pay.alipay.public-key=${ALIPAY_PUBLIC_KEY:}
qq.pay.alipay.notify-url=${ALIPAY_NOTIFY_URL:}

# ============================================================
# 第三方实时核验（密钥全部走环境变量，绝不明文）
# 默认 sandbox：本地模拟实时核验，工程闭环可跑通；生产切 real 并配置：
#   QQ_VERIFY_API_KEY / QQ_VERIFY_API_SECRET / QQ_VERIFY_API_BASE_URL
# 亦可设 offline 退回人工核验留痕（兼容旧行为）
# ============================================================
qq.verify.mode=sandbox
qq.verify.api-key=${QQ_VERIFY_API_KEY:}
qq.verify.api-secret=${QQ_VERIFY_API_SECRET:}
qq.verify.api-base-url=${QQ_VERIFY_API_BASE_URL:}

spring.jackson.default-property-inclusion=non_null
