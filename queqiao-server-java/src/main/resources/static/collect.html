<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>鹊桥·缘分登记 | 红娘一对一牵线</title>
<style>
  :root {
    --wine: #8B254A;        /* 勃艮第酒红 主色 */
    --wine-deep: #6E1C3A;
    --wine-soft: #B04A6E;
    --gold: #D4AF37;        /* 香槟金 辅色 */
    --gold-soft: #E9D08A;
    --paper: #FBF6F2;
    --ink: #2C2630;
    --ink-soft: #7A6F78;
    --line: #ECE2DC;
    --ok: #2E9E6B;
    --danger: #C0392B;
    --safe: rgba(255,255,255,.72);
    --glass: rgba(255,255,255,.55);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 背景：流动渐变光晕 + 柔和纹理 */
  .bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background:
      radial-gradient(120% 90% at 12% 0%, #FBE9EF 0%, rgba(251,233,239,0) 55%),
      radial-gradient(110% 80% at 100% 8%, #FBEFD8 0%, rgba(251,239,216,0) 50%),
      linear-gradient(180deg, #FBF2EE 0%, #F7ECE6 100%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(48px); opacity: .5; animation: float 16s ease-in-out infinite; }
  .blob.b1 { width: 260px; height: 260px; background: radial-gradient(circle, #E9A6C0, transparent 70%); top: -60px; left: -50px; }
  .blob.b2 { width: 300px; height: 300px; background: radial-gradient(circle, #EBD39A, transparent 70%); top: 38%; right: -90px; animation-delay: -5s; }
  .blob.b3 { width: 220px; height: 220px; background: radial-gradient(circle, #C58AA6, transparent 70%); bottom: -50px; left: 30%; animation-delay: -9s; }
  @keyframes float { 0%,100%{ transform: translateY(0) translateX(0) } 50%{ transform: translateY(-26px) translateX(14px) } }

  .wrap { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 18px calc(120px + env(safe-area-inset-bottom)); }

  /* 顶部品牌区 */
  .hero { text-align: center; padding: 38px 8px 10px; }
  .seal {
    width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px;
    background: linear-gradient(135deg, var(--wine), var(--wine-deep));
    display: grid; place-items: center; color: var(--gold); font-size: 30px; font-weight: 800;
    box-shadow: 0 12px 30px rgba(139,37,74,.32); transform: rotate(-4deg);
    animation: pop .7s cubic-bezier(.2,1.2,.3,1) both;
  }
  @keyframes pop { from{ transform: scale(.6) rotate(-12deg); opacity:0 } to{ transform: scale(1) rotate(-4deg); opacity:1 } }
  .hero h1 { margin: 0; font-size: 23px; letter-spacing: 2px; color: var(--wine); font-weight: 800; }
  .hero .sub { margin: 8px auto 0; font-size: 13px; color: var(--ink-soft); line-height: 1.7; max-width: 300px; }
  .hero .ribbon {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 6px 14px;
    background: var(--glass); border: 1px solid var(--gold-soft); border-radius: 999px;
    color: var(--wine); font-size: 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    animation: fadeUp .8s .25s both;
  }

  /* 进度条 */
  .progress { display: flex; align-items: center; justify-content: center; gap: 0; margin: 22px 0 6px; }
  .progress .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px;
    background: #fff; border: 2px solid var(--line); color: var(--ink-soft); transition: all .35s; font-weight: 700; }
  .progress .dot.active { background: var(--wine); border-color: var(--wine); color: #fff; transform: scale(1.08); box-shadow: 0 6px 14px rgba(139,37,74,.3); }
  .progress .dot.done { background: var(--gold); border-color: var(--gold); color: #fff; }
  .progress .bar { width: 36px; height: 3px; background: var(--line); margin: 0 2px; border-radius: 2px; transition: background .35s; }
  .progress .bar.fill { background: linear-gradient(90deg, var(--wine), var(--gold)); }

  /* 步骤容器 */
  .stage { position: relative; margin-top: 10px; }
  .step { display: none; }
  .step.show { display: block; animation: slideIn .45s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes slideIn { from{ opacity:0; transform: translateX(28px) } to{ opacity:1; transform: translateX(0) } }
  @keyframes fadeUp { from{ opacity:0; transform: translateY(12px) } to{ opacity:1; transform: translateY(0) } }

  /* 玻璃卡片 */
  .card {
    background: var(--glass); border: 1px solid rgba(255,255,255,.7); border-radius: 24px;
    padding: 20px 18px; margin-top: 14px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 10px 30px rgba(80,40,60,.10);
  }
  .card h2 { margin: 0 0 4px; font-size: 16px; color: var(--wine); font-weight: 800; }
  .card .hint { margin: 0 0 14px; font-size: 12px; color: var(--ink-soft); }

  /* 表单项 */
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-size: 13px; color: var(--ink); margin-bottom: 7px; font-weight: 600; }
  .field > label .req { color: var(--danger); margin-left: 3px; }
  .input, .textarea, .select {
    width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px;
    font-size: 15px; color: var(--ink); background: rgba(255,255,255,.85); transition: all .2s; outline: none;
  }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--wine-soft); background:#fff; box-shadow: 0 0 0 4px rgba(176,74,110,.12); }
  .textarea { resize: none; min-height: 84px; line-height: 1.6; }
  .input.invalid, .select.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(192,57,43,.10); }
  .err { color: var(--danger); font-size: 12px; margin-top: 6px; display: none; }
  .err.show { display: block; animation: fadeUp .25s both; }
  .city-cascade { display: flex; align-items: center; gap: 8px; }
  .city-cascade .select { appearance: none; -webkit-appearance: none; background-image:
    linear-gradient(45deg, transparent 50%, var(--wine-soft) 50%), linear-gradient(135deg, var(--wine-soft) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  .city-cascade .select:disabled { color: #a99; background-color: rgba(255,255,255,.5); cursor: not-allowed; }
  .city-cascade .cascade-arrow { color: var(--wine-soft); font-size: 18px; flex: 0 0 auto; }
  .city-cascade select { flex: 1 1 50%; min-width: 0; }

  /* 性别 / 婚姻 段选择 */
  .seg { display: flex; gap: 10px; flex-wrap: wrap; }
  .seg .opt {
    flex: 1; min-width: 70px; text-align: center; padding: 12px 6px; border-radius: 14px;
    border: 1.5px solid var(--line); background: rgba(255,255,255,.85); font-size: 14px; color: var(--ink-soft);
    transition: all .2s; cursor: pointer; user-select: none;
  }
  .seg .opt.on { border-color: var(--wine); color: var(--wine); background: #fff; font-weight: 700; box-shadow: 0 6px 16px rgba(139,37,74,.16); }
  .seg .opt:active { transform: scale(.97); }

  /* 滑块：年龄 / 身高 */
  .slider-row { display:flex; align-items:center; gap:12px; }
  .slider-row input[type=range] { -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:6px;
    background: linear-gradient(90deg, var(--wine) var(--p,50%), var(--line) var(--p,50%)); outline:none; }
  .slider-row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%;
    background:#fff; border:3px solid var(--wine); box-shadow: 0 3px 8px rgba(139,37,74,.3); cursor:pointer; }
  .slider-row input[type=range]::-moz-range-thumb { width:20px; height:20px; border-radius:50%; background:#fff; border:3px solid var(--wine); cursor:pointer; }
  .slider-val { min-width: 64px; text-align:center; font-weight:800; color: var(--wine); font-size:15px;
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 6px; }

  /* chip 多选（标签） */
  .chips { display:flex; flex-wrap:wrap; gap:9px; }
  .chip { padding: 9px 14px; border-radius: 999px; border:1.5px solid var(--line); background: rgba(255,255,255,.85);
    font-size: 13px; color: var(--ink-soft); transition: all .18s; cursor:pointer; }
  .chip.on { border-color: var(--gold); color: var(--wine); background: linear-gradient(135deg,#FFF6E2,#FBEAC6); font-weight:700; }
  .chip:active { transform: scale(.95); }

  /* 底部固定操作条 */
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(251,246,242,0), rgba(251,246,242,.96) 32%); }
  .actionbar .inner { max-width: 480px; margin: 0 auto; display:flex; gap: 12px; }
  .btn { flex:1; border:none; border-radius: 16px; padding: 15px; font-size: 16px; font-weight: 800; cursor: pointer;
    transition: all .2s; letter-spacing: 1px; }
  .btn.primary { background: linear-gradient(135deg, var(--wine), var(--wine-deep)); color: #fff; box-shadow: 0 10px 24px rgba(139,37,74,.32); }
  .btn.primary:active { transform: translateY(2px); box-shadow: 0 5px 14px rgba(139,37,74,.3); }
  .btn.ghost { flex: 0 0 auto; width: 96px; background: #fff; color: var(--ink-soft); border:1.5px solid var(--line); }
  .btn:disabled { opacity: .55; }
  .btn.loading { position: relative; color: transparent; }
  .btn.loading::after { content:""; position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px;
    border:2.5px solid rgba(255,255,255,.5); border-top-color:#fff; border-radius:50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* 隐私条 */
  .privacy { display:flex; align-items:flex-start; gap:8px; font-size:12px; color: var(--ink-soft); margin-top:14px; line-height:1.6; }
  .privacy input { margin-top:2px; accent-color: var(--wine); width:16px; height:16px; }
  .privacy a { color: var(--wine); text-decoration: none; }

  /* 成功浮层 */
  .success { position: relative; text-align:center; padding: 30px 10px 10px; animation: fadeUp .5s both; }
  .success .ring { width: 92px; height: 92px; margin: 0 auto 18px; border-radius:50%; background: linear-gradient(135deg, var(--ok), #57c98c);
    display:grid; place-items:center; box-shadow: 0 14px 30px rgba(46,158,107,.35); animation: pop .6s cubic-bezier(.2,1.3,.3,1) both; }
  .success .ring svg { width: 46px; height: 46px; }
  .success h2 { color: var(--wine); font-size: 21px; margin: 0 0 8px; }
  .success p { color: var(--ink-soft); font-size: 14px; line-height: 1.7; margin: 4px 0; }
  .success .card { text-align:left; margin-top: 18px; }
  .success .row { display:flex; justify-content:space-between; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .success .row:last-child { border-bottom:none; }
  .success .row .k { color: var(--ink-soft); }
  .success .row .v { color: var(--ink); font-weight: 700; }

  /* 轻提示 toast */
  .toast { position: fixed; left:50%; top: 22%; transform: transl(-50%,-10px); transform: translateX(-50%); z-index: 20;
    background: rgba(44,38,48,.92); color:#fff; padding: 11px 18px; border-radius: 12px; font-size: 14px; opacity:0; transition: all .3s; pointer-events:none; }
  .toast.show { opacity:1; transform: translateX(-50%) translateY(0); }

  .float-heart { position: fixed; z-index: 30; pointer-events: none; font-size: 22px; animation: rise 1.1s ease-out forwards; }
  @keyframes rise { 0%{ opacity:1; transform: translateY(0) scale(1) } 100%{ opacity:0; transform: translateY(-120px) scale(1.4) } }

  /* ===== 自定义下拉（美化原生 select，原生 select 仅作数据层） ===== */
  .dd { position: relative; display: block; width: 100%; }
  .dd-native { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
    opacity: 0; border: 0; pointer-events: none; clip: rect(0 0 0 0); overflow: hidden; }
  .dd-trigger { position: relative; width: 100%; text-align: left; cursor: pointer; font-family: inherit;
    border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 40px 13px 14px;
    font-size: 15px; color: var(--ink); background: rgba(255,255,255,.85);
    transition: all .2s; outline: none; display: flex; align-items: center; }
  .dd-trigger.placeholder { color: var(--ink-soft); }
  .dd-trigger .dd-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-trigger .dd-caret { position: absolute; right: 15px; top: 50%; width: 9px; height: 9px;
    border-right: 2px solid var(--wine-soft); border-bottom: 2px solid var(--wine-soft);
    transform: translateY(-65%) rotate(45deg); transition: transform .22s; pointer-events: none; }
  .dd-trigger.open { border-color: var(--wine); background: #fff; box-shadow: 0 0 0 4px rgba(176,74,110,.12); }
  .dd-trigger.open .dd-caret { transform: translateY(-35%) rotate(225deg); }
  .dd-trigger.disabled, .dd-trigger:disabled { color: #a99; background: rgba(255,255,255,.5); cursor: not-allowed; }
  .dd-native.invalid ~ .dd-trigger { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(192,57,43,.10); }
  .dd-panel { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 60;
    background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 6px;
    box-shadow: 0 16px 40px rgba(80,40,60,.18); max-height: 252px; overflow-y: auto;
    opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .18s, transform .18s; }
  .dd-panel.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .dd-item { padding: 12px 14px; border-radius: 10px; font-size: 14px; color: var(--ink);
    cursor: pointer; transition: background .15s; display: flex; align-items: center; justify-content: space-between; }
  .dd-item:hover { background: rgba(176,74,110,.08); }
  .dd-item.on { color: var(--wine); font-weight: 700; background: rgba(176,74,110,.10); }
  .dd-item.on::after { content: "✓"; color: var(--wine); font-weight: 700; margin-left: 8px; }
  .dd-panel::-webkit-scrollbar { width: 8px; }
  .dd-panel::-webkit-scrollbar-thumb { background: rgba(176,74,110,.25); border-radius: 8px; }
  .dd-panel::-webkit-scrollbar-track { background: transparent; }
  /* 级联场景：让 .dd 占据原本 select 的弹性槽位 */
  .city-cascade .dd { flex: 1 1 50%; min-width: 0; }
  .city-cascade .dd .dd-trigger { padding-right: 36px; }
  /* 防止下拉弹层被卡片圆角裁剪 */
  .card, .step, .form-wrap, .container { overflow: visible; }
</style>
</head>
<body>
<div class="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="wrap">
  <header class="hero">
    <div class="seal">囍</div>
    <h1>鹊桥 · 缘分登记</h1>
    <p class="sub">认真填写，让专属红娘更懂你。<br/>提交后将有红娘一对一为你牵线。</p>
    <div class="ribbon">🔒 信息加密保护 · 仅红娘可见</div>
  </header>

  <!-- 进度 -->
  <div class="progress" id="progress">
    <div class="dot active" data-i="0">1</div><div class="bar" data-i="0"></div>
    <div class="dot" data-i="1">2</div><div class="bar" data-i="1"></div>
    <div class="dot" data-i="2">3</div>
  </div>

  <form id="form" novalidate>
    <div class="stage">

      <!-- 步骤 1：基本信息 -->
      <section class="step show" data-step="0">
        <div class="card">
          <h2>① 基本信息</h2>
          <p class="hint">让红娘先认识你</p>

          <div class="field">
            <label>你的称呼 <span class="req">*</span></label>
            <input class="input" name="name" maxlength="30" placeholder="如：李明轩" />
            <div class="err">请填写称呼（不超过 30 字）</div>
          </div>

          <div class="field">
            <label>性别 <span class="req">*</span></label>
            <div class="seg" id="seg-gender">
              <div class="opt" data-val="男">男</div>
              <div class="opt" data-val="女">女</div>
            </div>
            <input type="hidden" name="gender" />
            <div class="err">请选择性别</div>
          </div>

          <div class="field">
            <label>年龄 <span class="req">*</span></label>
            <div class="slider-row">
              <input type="range" name="age" min="18" max="70" value="28" />
              <div class="slider-val"><span id="ageVal">28</span> 岁</div>
            </div>
          </div>

          <div class="field">
            <label>联系电话 <span class="req">*</span></label>
            <input class="input" name="phone" inputmode="numeric" maxlength="11" placeholder="11 位手机号，红娘联系你用" />
            <div class="err">请填写正确的 11 位手机号</div>
          </div>

          <div class="field">
            <label>所在地区 <span class="req">*</span></label>
            <div class="city-cascade">
              <select class="input select" id="province" name="province">
                <option value="">省份</option>
              </select>
              <span class="cascade-arrow">›</span>
              <select class="input select" id="city" name="city" disabled>
                <option value="">城市</option>
              </select>
              <span class="cascade-arrow">›</span>
              <select class="input select" id="district" name="district" disabled>
                <option value="">区/县</option>
              </select>
            </div>
            <div class="err">请完整选择 省 › 市 › 区/县</div>
          </div>
        </div>
      </section>

      <!-- 步骤 2：个人条件 -->
      <section class="step" data-step="1">
        <div class="card">
          <h2>② 个人条件</h2>
          <p class="hint">越真实，匹配越精准</p>

          <div class="field">
            <label>身高</label>
            <div class="slider-row">
              <input type="range" name="height" min="150" max="200" value="170" />
              <div class="slider-val"><span id="heightVal">170</span> cm</div>
            </div>
          </div>

          <div class="field">
            <label>学历</label>
            <select class="select" name="education">
              <option value="">请选择</option>
              <option>高中及以下</option><option>大专</option><option>本科</option>
              <option>硕士</option><option>博士</option>
            </select>
          </div>

          <div class="field">
            <label>职业</label>
            <input class="input" name="job" maxlength="60" placeholder="如：互联网产品经理" />
          </div>

          <div class="field">
            <label>月收入</label>
            <select class="select" name="income">
              <option value="">请选择</option>
              <option>5k 以下</option><option>5k-1w</option><option>1w-2w</option>
              <option>2w-5w</option><option>5w-10w</option><option>10w 以上</option>
            </select>
          </div>

          <div class="field">
            <label>婚姻状况</label>
            <div class="seg" id="seg-marriage">
              <div class="opt" data-val="未婚">未婚</div>
              <div class="opt" data-val="离异">离异</div>
              <div class="opt" data-val="丧偶">丧偶</div>
            </div>
            <input type="hidden" name="marriage" />
          </div>

          <div class="field">
            <label>是否育有子女</label>
            <div class="seg" id="seg-child">
              <div class="opt" data-val="无">无</div>
              <div class="opt" data-val="有">有</div>
            </div>
            <input type="hidden" name="hasChild" />
          </div>

          <div class="field">
            <label>房车情况</label>
            <div class="chips" id="chips-asset">
              <div class="chip" data-val="有房">有房</div>
              <div class="chip" data-val="有车">有车</div>
              <div class="chip" data-val="均无">均无</div>
            </div>
            <input type="hidden" name="house" />
          </div>
        </div>
      </section>

      <!-- 步骤 3：择偶 & 自述 -->
      <section class="step" data-step="2">
        <div class="card">
          <h2>③ 期待的另一半</h2>
          <p class="hint">说说你的理想型，红娘按此优先撮合</p>

          <div class="field">
            <label>择偶要求</label>
            <textarea class="textarea" name="requirement" maxlength="2000" placeholder="如：希望对方性格温柔、在杭州工作、本科以上、年龄相仿…"></textarea>
          </div>

          <div class="field">
            <label>个人自述</label>
            <textarea class="textarea" name="bio" maxlength="2000" placeholder="兴趣爱好、性格特点、生活态度…让对方更了解你"></textarea>
          </div>

          <div class="field">
            <label>意向红娘</label>
            <select class="select" name="agent" id="agentSel">
              <option value="">不指定（由平台分配）</option>
            </select>
            <div class="err" style="color:var(--ink-soft)">若你已有对接的红娘，可在此直接指定</div>
          </div>

          <div class="field">
            <label>想给红娘的留言</label>
            <textarea class="textarea" name="remark" maxlength="500" placeholder="可备注期望沟通时间等"></textarea>
          </div>
        </div>

        <div class="privacy">
          <input type="checkbox" id="agree" />

  const $ = (s, r) => (r || document).querySelector(s);

  const form = $("#form");

  /* ---------- 进度 ---------- */
  function renderProgress() {
    $$(".progress .dot").forEach((d) => {
      const i = +d.dataset.i;
      d.classList.toggle("active", i === cur);
      d.classList.toggle("done", i < cur);
    });
    $$(".progress .bar").forEach((b) => b.classList.toggle("fill", +b.dataset.i < cur));
  }

  /* ---------- 步骤切换 ---------- */
  function showStep(i) {
    cur = Math.max(0, Math.min(TOTAL - 1, i));
    $$(".step").forEach((s) => s.classList.toggle("show", +s.dataset.step === cur));
    btnPrev.style.display = cur === 0 ? "none" : "";
    btnNext.textContent = cur === TOTAL - 1 ? "提交登记" : "下一步";
    renderProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- 段选择 ---------- */
  function bindSeg(id, hiddenName) {
    const box = $(id);
    box.addEventListener("click", (e) => {
      const opt = e.target.closest(".opt");
      if (!opt) return;
      $$(".opt", box).forEach((o) => o.classList.remove("on"));
      opt.classList.add("on");
      form.elements[hiddenName].value = opt.dataset.val;
      clearErr(opt.closest(".field"));
    });
  }

    districtSel.innerHTML = '<option value="">区/县</option>';
    const c = citySel.value;
    const districts = CITY_DISTRICT[c];
    if (!c || !districts || districts.length === 0) {
      // 不设区的市：补一个与市同名的占位项，保证末级可填、地址语义完整
      if (c && (!districts || districts.length === 0)) {
        const o = document.createElement("option"); o.value = c; o.textContent = c; districtSel.appendChild(o);
        districtSel.disabled = false;
      } else {
        districtSel.disabled = true;
      }
      clearErr(citySel.closest(".field"));
      return;
    }
    districts.forEach((d) => {
      const o = document.createElement("option"); o.value = d; o.textContent = d; districtSel.appendChild(o);
    });
    districtSel.disabled = false;
    clearErr(citySel.closest(".field"));
  });
  districtSel.addEventListener("change", () => clearErr(districtSel.closest(".field")));

  /* ---------- 拉取在职红娘（指定红娘下拉）---------- */
  async function loadAgents() {
    const sel = $("#agentSel");
    if (!sel) return;
    try {
      const res = await fetch("/api/agents?status=在职&size=200", { headers: { "User-Agent": "Mozilla/5.0" } });
      if (!res.ok) return;
      const data = await res.json().catch(() => null);
      const list = (data && (data.list || data.data || data)) || [];
      if (!Array.isArray(list)) return;
      list.filter(a => a && a.name).forEach((a) => {
        const opt = document.createElement("option");
        opt.value = a.name;
        opt.textContent = a.region ? (a.name + "（" + a.region + "）") : a.name;
        sel.appendChild(opt);
      });
    } catch (e) { /* 静默降级：下拉仅留「不指定」 */ }
  }
  loadAgents();

  /* ---------- 实时清错 & 输入限制 ---------- */
  $$(".input").forEach((inp) => {
    inp.addEventListener("input", () => clearErr(inp.closest(".field")));
  });
  form.elements["phone"].addEventListener("input", (e) => {
    e.target.value = e.target.value.replace(/\D/g, "").slice(0, 11);
  });

  /* ---------- 校验 ---------- */
  function setErr(field, msg) {
    if (!field) return;
    const err = $(".err", field);
    if (err) { if (msg) err.textContent = msg; err.classList.add("show"); }
    const inp = $("input,select,textarea", field);
    if (inp && inp.classList) inp.classList.add("invalid");
  }
  function clearErr(field) {
    if (!field) return;
    const err = $(".err", field);
    if (err) err.classList.remove("show");
    const inp = $("input,select,textarea", field);
    if (inp && inp.classList) inp.classList.remove("invalid");
  }

  function validateStep(i) {
    let ok = true;
    if (i === 0) {
      const name = form.elements["name"];
      if (!name.value.trim() || name.value.trim().length > 30) { setErr(name.closest(".field")); ok = false; }
      const gender = form.elements["gender"];
      if (!gender.value) { setErr($("#seg-gender").closest(".field")); ok = false; }
      const phone = form.elements["phone"];
      if (!/^1[3-9]\d{9}$/.test(phone.value.trim())) { setErr(phone.closest(".field")); ok = false; }
      const city = form.elements["city"];
      if (!provinceSel.value || !citySel.value || !districtSel.value) { setErr(citySel.closest(".field")); ok = false; }
    }
    if (i === 1) {
      // 第二页「个人条件」：结构化匹配维度必填校验，与 public/register 后端枚举/非空规则对齐
      const education = form.elements["education"];
      if (!education.value) { setErr(education.closest(".field")); ok = false; }
      const income = form.elements["income"];
      if (!income.value) { setErr(income.closest(".field")); ok = false; }
      const marriage = form.elements["marriage"];
      if (!marriage.value) { setErr(marriage.closest(".field")); ok = false; }
      const hasChild = form.elements["hasChild"];
      if (!hasChild.value) { setErr(hasChild.closest(".field")); ok = false; }
      const house = form.elements["house"];
      if (!house.value) { setErr(house.closest(".field")); ok = false; }
      // height 为滑块恒有值(150~200)；job 为选填自由文本(maxlength 已限)，二者无需前端拦截
    }
    if (i === TOTAL - 1) {
      if (!$("#agree").checked) { toast("请先勾选隐私授权"); ok = false; }
    }
    return ok;
  }

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  /* ---------- 飘心动效 ---------- */
  function burstHearts(n) {
    const emo = ["💗", "💕", "🌸", "💞", "✨"];
    for (let k = 0; k < n; k++) {
      const h = document.createElement("div");
      h.className = "float-heart";
      h.textContent = emo[Math.floor(Math.random() * emo.length)];
      h.style.left = (40 + Math.random() * 20) + "%";
      h.style.top = (55 + Math.random() * 10) + "%";
      h.style.animationDelay = (k * 0.08) + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1300);
    }
  }

  /* ---------- 组装 payload（对齐 Member 字段 + public/register 入参）---------- */
  function buildPayload() {
    const fd = new FormData(form);
    const g = (k) => (fd.get(k) || "").toString().trim();
    const p = {
      name: g("name"),
      gender: g("gender"),
      phone: g("phone"),
      city: (() => {
        const c = citySel.value;
        return c || ""; // 仅存合法市名（市已唯一归属省份），杜绝自由文本脏数据
      })(),
      district: (() => {
        const d = districtSel.value;
        return d || ""; // 仅存合法区县名，杜绝自由文本脏数据
      })(),
      province: provinceSel.value || undefined,
      education: g("education"),
      job: g("job"),
      income: g("income"),
      marriage: g("marriage"),
      hasChild: g("hasChild"),
      house: g("house"),
      requirement: g("requirement"),
      bio: g("bio"),
      remark: g("remark"),
      agent: g("agent"),
      age: +form.elements["age"].value,
      height: +form.elements["height"].value,
    };
    // 仅保留非空字段，减少噪声；age/height 恒带（在 18~70 / 150~200 合法区间内）
    Object.keys(p).forEach((k) => { if (p[k] === "" || p[k] == null) delete p[k]; });
    return p;
  }

  /* ---------- 提交 ---------- */
  async function submit() {
    const btn = btnNext;
    btn.classList.add("loading"); btn.disabled = true;
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(buildPayload()),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ("提交失败（" + res.status + "）"));
      showSuccess(data);
    } catch (e) {
      toast(e.message || "网络异常，请稍后重试");
      btn.classList.remove("loading"); btn.disabled = false;
    }
  }

  /* ---------- 成功页 ---------- */
  function showSuccess(data) {
    burstHearts(14);
    const name = data.name || form.elements["name"].value.trim();
    const agent = data.agent || "待分配";
    const wrap = $(".wrap");
    wrap.innerHTML =
      '<div class="success">' +
        '<div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>' +
        '<h2>登记成功 🎉</h2>' +
        '<p>亲爱的 ' + escapeHtml(name) + '，你的缘分档案已建立</p>' +
        '<p>专属红娘将在 <b>24 小时内</b> 与你联系确认～</p>' +
        '<div class="card">' +
          '<div class="row"><span class="k">档案编号</span><span class="v">' + escapeHtml(data.id || "—") + '</span></div>' +
          '<div class="row"><span class="k">服务状态</span><span class="v">' + escapeHtml(data.status || "待审核") + '</span></div>' +
          '<div class="row"><span class="k">归属红娘</span><span class="v">' + escapeHtml(agent) + '</span></div>' +
        '</div>' +
        '<button class="btn primary" id="btnPoster" style="margin-top:18px;width:100%">📲 生成分享海报</button>' +
        '<p style="margin-top:14px;font-size:12px;color:#b3a8af">红娘工作台「会员管理」现已可查看到你的登记信息</p>' +
      '</div>';
    $(".actionbar").style.display = "none";
    $(".progress").style.display = "none";
    window.scrollTo({ top: 0, behavior: "smooth" });
    $("#btnPoster").addEventListener("click", () => openPoster(name, agent));
  }

  /* ---------- 分享海报 ---------- */
  function openPoster(name, agent) {
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;z-index:40;background:rgba(20,12,18,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px);animation:fadeUp .3s both";
    overlay.innerHTML =
      '<div style="color:#fff;font-size:14px;margin-bottom:12px">长按图片即可保存 / 分享给好友</div>' +
      '<canvas id="posterCv" style="width:300px;max-width:82vw;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.4)"></canvas>' +
      '<button id="posterClose" style="margin-top:16px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:12px;padding:10px 22px;font-size:14px">关闭</button>';
    document.body.appendChild(overlay);
    $("#posterClose", overlay).addEventListener("click", () => overlay.remove());
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
    drawPoster($("#posterCv", overlay), name, agent);
  }

  function drawPoster(cv, name, agent) {
    const W = 600, H = 900, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#8B254A"); bg.addColorStop(0.55, "#6E1C3A"); bg.addColorStop(1, "#4A1226");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(W / 2, 120, 20, W / 2, 120, 360);
    glow.addColorStop(0, "rgba(212,175,55,.42)"); glow.addColorStop(1, "rgba(212,175,55,0)");
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, 360);

    ctx.save();
    ctx.translate(W / 2, 130); ctx.rotate(-0.06);
    const r = 52;
    const lg = ctx.createLinearGradient(-r, -r, r, r); lg.addColorStop(0, "#B04A6E"); lg.addColorStop(1, "#6E1C3A");
    ctx.fillStyle = lg; roundRect(ctx, -r, -r, r * 2, r * 2, 18); ctx.fill();
    ctx.fillStyle = "#D4AF37"; ctx.font = "800 46px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("囍", 0, 2);
    ctx.restore();

    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.font = "800 38px -apple-system, 'PingFang SC', sans-serif";
    ctx.fillText("鹊桥 · 缘分登记", W / 2, 250);
    ctx.fillStyle = "rgba(255,255,255,.82)"; ctx.font = "400 17px -apple-system, 'PingFang SC', sans-serif";
    ctx.fillText("认真填写，让专属红娘更懂你", W / 2, 286);

    const cardX = 50, cardY = 330, cardW = W - 100, cardH = 250;
    ctx.fillStyle = "rgba(255,255,255,.14)"; roundRect(ctx, cardX, cardY, cardW, cardH, 24); ctx.fill();
    ctx.strokeStyle = "rgba(212,175,55,.5)"; ctx.lineWidth = 1.5; roundRect(ctx, cardX, cardY, cardW, cardH, 24); ctx.stroke();
    ctx.textAlign = "left";
    drawRow(ctx, "登记人", name || "—", cardX + 28, cardY + 56);
    drawRow(ctx, "归属红娘", (agent && agent !== "待分配") ? agent : "平台智能分配", cardX + 28, cardY + 116);
    drawRow(ctx, "服务状态", "待审核 · 24h 内联系", cardX + 28, cardY + 176);
    ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.font = "400 13px -apple-system, 'PingFang SC', sans-serif";
    ctx.fillText("提交后红娘工作台「会员管理」即可查收你的档案", cardX + 28, cardY + 216);

    const qrSize = 150, qrX = (W - qrSize) / 2, qrY = 620;
    ctx.fillStyle = "#fff"; roundRect(ctx, qrX - 14, qrY - 14, qrSize + 28, qrSize + 28, 16); ctx.fill();
    try {
      const url = location.href.split("#")[0];
      drawQR(ctx, url, qrX, qrY, qrSize);
    } catch (e) {
      ctx.fillStyle = "#999"; ctx.font = "13px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("二维码生成失败", W / 2, qrY + qrSize / 2);
    }
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "600 16px -apple-system, 'PingFang SC', sans-serif";
    ctx.fillText("微信扫一扫 · 立即登记缘分", W / 2, qrY + qrSize + 44);
    ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.font = "400 12px -apple-system, 'PingFang SC', sans-serif";
    ctx.fillText("鹊桥红娘工作台 · 信息加密保护", W / 2, H - 34);
  }

  function drawRow(ctx, k, v, x, y) {
    ctx.fillStyle = "rgba(255,255,255,.65)"; ctx.font = "400 14px -apple-system, 'PingFang SC', sans-serif"; ctx.textAlign = "left";
    ctx.fillText(k, x, y - 16);
    ctx.fillStyle = "#fff"; ctx.font = "700 20px -apple-system, 'PingFang SC', sans-serif";
    ctx.fillText(v, x, y + 6);
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------- 纯 JS 二维码（qrcode-generator 核心，MIT，零依赖，真实可扫）---------- */
  function drawQR(ctx, text, x, y, size) {
    ctx.fillStyle = "#fff"; ctx.fillRect(x, y, size, size);
    if (window._qrcodeLib) {
      try {
        const qr = window._qrcodeLib(0, "M");
        qr.addData(text); qr.make();
        const n = qr.getModuleCount();
        const cell = size / n;
        ctx.fillStyle = "#2C2630";
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
          if (qr.isDark(r, c)) ctx.fillRect(x + c * cell, y + r * cell, Math.ceil(cell), Math.ceil(cell));
        }
        return;
      } catch (e) { /* 降级 */ }
    }
    ctx.fillStyle = "#2C2630"; ctx.font = "13px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("二维码需联网生成", x + size / 2, y + size / 2);
  }
  (function loadQR() {
    if (window._qrcodeLib) return;
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";
    s.onload = () => { try { window._qrcodeLib = window.qrcode; } catch (e) {} };
    s.onerror = () => {};
    document.head.appendChild(s);
  })();
  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------- 按钮事件 ---------- */
  btnNext.addEventListener("click", () => {
    if (!validateStep(cur)) { toast(cur === TOTAL - 1 ? "请完成必填项与授权" : "请完成本页必填项"); return; }
    if (cur < TOTAL - 1) { showStep(cur + 1); }
    else { submit(); }
  });
  btnPrev.addEventListener("click", () => showStep(cur - 1));

  renderProgress();

  /* ===== 自定义下拉增强：原生 select 仅作数据层，叠加主题化触发器/弹层 ===== */
  function enhanceSelect(sel) {
    sel.classList.add("dd-native");
    sel.classList.remove("input", "select");

    const dd = document.createElement("div");
    dd.className = "dd";
    sel.parentNode.insertBefore(dd, sel);
    dd.appendChild(sel);

    const trigger = document.createElement("button");
    trigger.type = "button";
    trigger.className = "dd-trigger";
    trigger.innerHTML = '<span class="dd-label"></span><span class="dd-caret"></span>';

    const panel = document.createElement("div");
    panel.className = "dd-panel";

    dd.appendChild(trigger);
    dd.appendChild(panel);

    function placeholderText() {
      const ph = Array.from(sel.options).find((o) => o.value === "");
      return ph ? ph.textContent : "请选择";
    }
    function syncTrigger() {
      const opt = sel.options[sel.selectedIndex];
      const txt = opt && opt.value !== "" ? opt.textContent : "";
      const label = $(".dd-label", trigger);
      if (txt) { label.textContent = txt; trigger.classList.remove("placeholder"); }
      else { label.textContent = placeholderText(); trigger.classList.add("placeholder"); }
      trigger.disabled = sel.disabled;
      trigger.classList.toggle("disabled", !!sel.disabled);
      Array.from(panel.children).forEach((it) => it.classList.toggle("on", it.dataset.val === sel.value));
    }
    function renderPanel() {
      panel.innerHTML = "";
      Array.from(sel.options).forEach((o) => {
        if (o.value === "") return;
        const it = document.createElement("div");
        it.className = "dd-item";
        it.dataset.val = o.value;
        it.textContent = o.textContent;
        it.addEventListener("click", (e) => {
          e.stopPropagation();
          if (sel.disabled) return;
          sel.value = o.value;
          sel.dispatchEvent(new Event("change", { bubbles: true }));
          syncTrigger();
          closePanel();
        });
        panel.appendChild(it);
      });
      syncTrigger();
    }
    function openPanel() {
      if (sel.disabled) return;
      closeAllPanels(dd);
      panel.classList.add("open");
      trigger.classList.add("open");
      const on = $(".dd-item.on", panel);
      if (on) on.scrollIntoView({ block: "nearest" });
    }
    function closePanel() {
      panel.classList.remove("open");
      trigger.classList.remove("open");
    }
    trigger.addEventListener("click", (e) => {
      e.stopPropagation();
      if (sel.disabled) return;
      if (panel.classList.contains("open")) closePanel();
      else openPanel();
    });
    new MutationObserver(() => renderPanel()).observe(sel, { childList: true, subtree: true });
    sel.addEventListener("change", syncTrigger);
    renderPanel();
  }
  function closeAllPanels(except) {
    $$(".dd").forEach((d) => {
      if (d === except) return;
      const p = $(".dd-panel", d); const t = $(".dd-trigger", d);
      if (p) p.classList.remove("open");
      if (t) t.classList.remove("open");
    });
  }
  document.addEventListener("click", () => closeAllPanels(null));

  $$("select.select").forEach(enhanceSelect);
})();
</script>
</body>
