﻿/* ==========================================================================
   Matchmaker Workbench — Liquid Glass Design System
   Brand: 婚恋红娘智能工作台
   Palette: Warm Cream + Dusty Rose + Rose Gold
   ========================================================================== */

:root {
  /* --- Brand Primary: Dusty Rose (莫兰迪烟粉玫瑰) --- */
  --brand-primary: #A8667D;
  --brand-primary-light: #BE8298;
  --brand-primary-lighter: #D4A3B5;
  --brand-primary-soft: rgba(168, 102, 125, 0.08);
  --brand-primary-soft-2: rgba(168, 102, 125, 0.15);
  --brand-primary-glow: rgba(168, 102, 125, 0.25);
  --brand-primary-foreground: #FFFFFF;

  /* --- Accent: Rose Gold (玫瑰金) --- */
  --brand-gold: #C8956C;
  --brand-gold-light: #DCB48E;
  --brand-gold-dark: #A87A52;
  --brand-gold-soft: rgba(200, 149, 108, 0.12);
  --brand-gold-gradient: linear-gradient(135deg, #DCB48E 0%, #C8956C 50%, #A87A52 100%);

  /* --- Background: Warm White to Oat gradient --- */
  --brand-bg-base: #FDF6F2;
  --brand-bg-oat: #F5EAE2;
  --brand-bg-gradient: linear-gradient(180deg, #FDF6F2 0%, #F5EAE2 100%);

  /* --- Semantic surfaces --- */
  --brand-background: #FDF6F2;
  --brand-foreground: #3E2D35;
  --brand-card: rgba(255, 255, 255, 0.72);
  --brand-card-solid: #FFFFFF;
  --brand-card-foreground: #3E2D35;
  --brand-popover: rgba(255, 255, 255, 0.92);
  --brand-popover-foreground: #3E2D35;
  --brand-muted: rgba(168, 102, 125, 0.04);
  --brand-muted-foreground: #968089;
  --brand-border: rgba(168, 102, 125, 0.08);
  --brand-border-strong: rgba(168, 102, 125, 0.16);
  --brand-input: rgba(255, 255, 255, 0.6);
  --brand-ring: rgba(168, 102, 125, 0.35);

  /* --- Liquid Glass surfaces --- */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-bg-strong: rgba(255, 255, 255, 0.75);
  --glass-bg-light: rgba(255, 255, 255, 0.40);
  --glass-border: rgba(255, 255, 255, 0.6);
  --glass-border-inner: rgba(255, 255, 255, 0.8);
  --glass-shadow: 0 8px 32px -8px rgba(120, 70, 80, 0.10);
  --glass-shadow-strong: 0 20px 40px -12px rgba(120, 70, 80, 0.12);
  --glass-shadow-soft: 0 4px 16px -4px rgba(120, 70, 80, 0.06);
  --glass-blur: blur(20px);
  --glass-blur-sm: blur(12px);

  /* --- Ink hierarchy --- */
  --brand-ink-1: #2E222A;
  --brand-ink-2: #5C4B55;
  --brand-ink-3: #968089;
  --brand-ink-4: #BFAAB2;

  /* --- Status colors (semantic only) --- */
  --state-success: #5B8C5A;
  --state-success-soft: rgba(91, 140, 90, 0.10);
  --state-warning: #C89060;
  --state-warning-soft: rgba(200, 144, 96, 0.10);
  --state-error: #B84A4A;
  --state-error-soft: rgba(184, 74, 74, 0.10);
  --state-info: #6B7C93;

  /* --- Typography --- */
  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --brand-font-display: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

  /* --- Radius scale (Liquid Glass uses generous rounding) --- */
  --brand-radius-sm: 8px;
  --brand-radius-md: 14px;
  --brand-radius-lg: 20px;
  --brand-radius-xl: 28px;
  --brand-radius-2xl: 32px;
  --brand-radius-pill: 999px;

  /* --- Shadows --- */
  --brand-shadow-xs: 0 1px 2px rgba(120, 70, 80, 0.04);
  --brand-shadow-sm: 0 2px 8px -2px rgba(120, 70, 80, 0.06);
  --brand-shadow-md: 0 8px 24px -8px rgba(120, 70, 80, 0.10);
  --brand-shadow-lg: 0 20px 40px -12px rgba(120, 70, 80, 0.12);
  --brand-shadow-glow: 0 0 24px rgba(168, 102, 125, 0.15);

  /* --- Spacing (8pt grid) --- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
}

/* --- Noise texture overlay for premium feel --- */
.noise-texture::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.035;
  pointer-events: none;
  z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 128px 128px;
}

/* --- Liquid Glass base card --- */
.glass-card {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: var(--brand-radius-xl);
}

.glass-card-strong {
  background: var(--glass-bg-strong);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow-strong);
  border-radius: var(--brand-radius-xl);
}

/* --- Focus ring --- */
.focus-ring:focus-within,
.focus-ring:focus-visible {
  box-shadow: 0 0 0 3px var(--brand-primary-glow), var(--glass-shadow);
  border-color: var(--brand-primary-light);
}

    </style>

  @layer base {

  }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }

    <style id="critical-layout">
      html { scroll-behavior: smooth; }
      body { -webkit-tap-highlight-color: transparent; margin: 0; }
      * { box-sizing: border-box; }

      .match-score-ring {
        background: conic-gradient(var(--brand-primary) 0deg, var(--brand-gold) calc(87 * 3.6deg), rgba(168,102,125,0.08) calc(87 * 3.6deg));
        border-radius: 50%;
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .match-score-inner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .back-layer-2 {
        position: absolute;
        top: 8px; left: 8px; right: 8px; bottom: -8px;
        border-radius: 28px;
        background: var(--glass-bg-light);
        border: 1px solid var(--glass-border);
        transform: scale(0.96);
        z-index: 1;
      }
      .back-layer-1 {
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: -4px;
        border-radius: 28px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        transform: scale(0.98);
        z-index: 2;
      }

      .action-btn {
        transition: transform 0.15s ease;
        cursor: pointer;
        min-height: 44px;
      }
      .action-btn:active {
        transform: scale(0.92);
      }

      button, a, [role="button"] { min-height: 44px; }

      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--brand-bg-gradient); min-height: 100vh;">

        <!-- Status bar spacer -->
        <div style="height:12px;"></div>

          <button class="action-btn flex items-center justify-center rounded-full" style="width:38px; height:38px; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">

          <div class="flex items-center justify-center rounded-full shrink-0" style="width:36px; height:36px; background: var(--brand-gold-gradient);">

              </div>
              <span style="font-size:13px; color:var(--brand-ink-2);">王雅婷 × 张浩然</span>

            <span class="shrink-0" style="font-size:11px; background:var(--state-success-soft); color:var(--state-success); padding:3px 10px; border-radius:999px;">已约见</span>

              </div>
              <span style="font-size:13px; color:var(--brand-ink-2);">赵雨萱 × 刘天阳</span>

n></button></div></nav>
